<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Магазин - Адаптивная навигация</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }

      /* Верхний хедер (постоянно видимый) */
      .top-header {
        position: sticky;
        top: 0;
        background: white;
        border-bottom: 1px solid #eee;
        padding: 12px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 1000;
      }

      .brand {
        font-weight: bold;
        font-size: 1.2rem;
      }

      .header-actions {
        display: flex;
        gap: 20px;
        align-items: center;
      }

      .icon-btn {
        background: none;
        border: none;
        font-size: 1.3rem;
        position: relative;
        cursor: pointer;
      }

      .badge {
        position: absolute;
        top: -5px;
        right: -5px;
        background: #ff4757;
        color: white;
        font-size: 0.7rem;
        padding: 2px 6px;
        border-radius: 10px;
      }

      /* Поисковая строка (появляется по клику) */
      .search-expandable {
        display: none;
        padding: 10px 16px;
        background: #f8f9fa;
        border-bottom: 1px solid #eee;
      }

      .search-expandable.active {
        display: block;
      }

      .search-input {
        width: 100%;
        padding: 12px;
        border: 2px solid #007bff;
        border-radius: 8px;
        font-size: 1rem;
      }

      /* Бургер-меню */
      .burger-menu {
        position: fixed;
        top: 0;
        right: -100%;
        width: 85%;
        max-width: 320px;
        height: 100%;
        background: white;
        box-shadow: -5px 0 20px rgba(0, 0, 0, 0.15);
        transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 1001;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }

      .burger-menu.active {
        right: 0;
      }

      .menu-header {
        padding: 20px;
        border-bottom: 1px solid #eee;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .close-menu {
        font-size: 1.8rem;
        background: none;
        border: none;
        cursor: pointer;
      }

      .user-info {
        padding: 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      .menu-list {
        flex: 1;
        padding: 20px 0;
      }

      .menu-item {
        display: block;
        padding: 16px 20px;
        text-decoration: none;
        color: #333;
        border-bottom: 1px solid #f5f5f5;
        font-size: 1rem;
      }

      .menu-item:hover {
        background: #f8f9fa;
      }

      .menu-footer {
        padding: 20px;
        border-top: 1px solid #eee;
      }

      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s;
        z-index: 1000;
      }

      .overlay.active {
        opacity: 1;
        visibility: visible;
      }

      /* Контент */
      .content {
        padding: 20px;
      }

      /* Медиазапросы для планшетов и десктопов */
      @media (min-width: 768px) {
        .burger-btn {
          display: none;
        }

        .desktop-nav {
          display: flex;
          gap: 30px;
          margin-left: 40px;
        }

        .desktop-nav a {
          text-decoration: none;
          color: #333;
          font-weight: 500;
        }

        .search-expandable {
          display: block;
          position: static;
          background: transparent;
          border: none;
          padding: 0;
          width: 300px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Верхняя панель с основными действиями -->
    <div class="top-header">
      <div class="brand">SHOPPING</div>

      <div class="header-actions">
        <!-- Поиск на десктопе, иконка на мобильных -->
        <button class="icon-btn search-toggle" onclick="toggleSearch()">
          🔍
        </button>

        <!-- Корзина всегда видна -->
        <button class="icon-btn cart-btn" onclick="openCart()">
          🛒
          <span class="badge">3</span>
        </button>

        <!-- Бургер-меню для мобильных -->
        <button class="icon-btn burger-btn" onclick="toggleMenu()">☰</button>
      </div>
    </div>

    <!-- Раскрывающийся поиск для мобильных -->
    <div class="search-expandable" id="searchBox">
      <input type="search" class="search-input" placeholder="Что ищете?" />
    </div>

    <!-- Бургер-меню со ВСЕМИ элементами -->
    <nav class="burger-menu" id="burgerMenu">
      <div class="menu-header">
        <h3>Меню</h3>
        <button class="close-menu" onclick="toggleMenu()">×</button>
      </div>

      <div class="user-info">
        <h4>Иван Иванов</h4>
        <p>Баланс: 1 500 ₽</p>
      </div>

      <div class="menu-list">
        <a href="#" class="menu-item">🏠 Главная</a>
        <a href="#" class="menu-item">📦 Категории</a>
        <a href="#" class="menu-item">🔥 Акции</a>
        <a href="#" class="menu-item">❤️ Избранное</a>
        <a href="#" class="menu-item">📋 История заказов</a>
        <a href="#" class="menu-item">👤 Профиль</a>
        <a href="#" class="menu-item">⚙️ Настройки</a>
        <a href="#" class="menu-item">📞 Поддержка</a>
        <a href="#" class="menu-item">ℹ️ О нас</a>
      </div>

      <div class="menu-footer">
        <button
          class="logout-btn"
          style="
            width: 100%;
            padding: 12px;
            background: #f8f9fa;
            border: none;
            border-radius: 8px;
          "
        >
          Выйти из аккаунта
        </button>
      </div>
    </nav>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <main class="content">
      <h1>Добро пожаловать в магазин!</h1>
      <p>Товары и услуги...</p>
    </main>

    <script>
      function toggleMenu() {
        const menu = document.getElementById("burgerMenu");
        const overlay = document.getElementById("overlay");
        menu.classList.toggle("active");
        overlay.classList.toggle("active");
        document.body.style.overflow = menu.classList.contains("active")
          ? "hidden"
          : "";
      }

      function toggleSearch() {
        const searchBox = document.getElementById("searchBox");
        if (window.innerWidth < 768) {
          searchBox.classList.toggle("active");
          if (searchBox.classList.contains("active")) {
            searchBox.querySelector("input").focus();
          }
        }
      }

      function openCart() {
        // Логика открытия корзины
        alert("Корзина открыта!");
      }

      // Закрытие меню по Escape
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          document.getElementById("burgerMenu").classList.remove("active");
          document.getElementById("overlay").classList.remove("active");
          document.body.style.overflow = "";
        }
      });
    </script>
  </body>
</html>
