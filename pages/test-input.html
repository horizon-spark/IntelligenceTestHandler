<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Главная</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="header block">
      <a href="./index.html">Главная</a>
      <a href="./about.html">О методике</a>
      <a href="https://www.center-psychology.ru/">Сайт автора методики</a>
      <button
        class="burger-btn"
        aria-label="Открыть меню"
        aria-expanded="false"
      >
        ☰
      </button>
    </div>
    <div class="desktop-nav block">
      <p><a href="./login.html">Войти</a></p>
      <p><a href="./test-input.html">Обработать тест</a></p>
      <p><a href="./history.html">История</a></p>
    </div>
    <div class="mobile-nav block hidden">
      <p><a href="./login.html">Войти</a></p>
      <p>
        <a href="./test-input.html">Обработать тест</a>
      </p>
      <p><a href="./history.html">История</a></p>
    </div>
    <div class="mainArticle block">
      <h3>Заполните данные испытуемого:</h3>
      <form>
        <h4>Личная информация:</h4>
        <label for="name">Имя</label>
        <input type="text" name="name" id="name" value="Иван" />
        <label for="surname">Фамилия</label>
        <input type="text" name="surname" id="surname" value="Иванов" />
        <label for="school">Школа</label>
        <input type="text" name="school" id="school" value="Гимназия 9" />
        <fieldset>
          <legend>Выберите номер класса</legend>
          <label>
            <input type="radio" name="grade" required value="7" />7
          </label>
          <label>
            <input type="radio" name="grade" required value="8" />8
          </label>
          <label>
            <input type="radio" name="grade" required value="9" />9
          </label>
          <label>
            <input type="radio" name="grade" required value="10" />10
          </label>
          <label>
            <input type="radio" name="grade" required value="11" checked />11
          </label>
        </fieldset>
        <fieldset>
          <legend>Литера класса</legend>
          <label>
            <input type="radio" name="letter" required value="A" checked />А
          </label>
          <label>
            <input type="radio" name="letter" required value="B" />Б
          </label>
          <label>
            <input type="radio" name="letter" required value="C" />В
          </label>
          <label>
            <input type="radio" name="letter" required value="D" />Г
          </label>
          <label>
            <input
              type="radio"
              name="letter"
              required
              value="anotherLetter"
            />Другая
          </label>
        </fieldset>
        <fieldset>
          <legend>Профиль класса</legend>
          <label>
            <input
              type="radio"
              name="specialization"
              required
              value="humanitarian"
            />Гуманитарный
          </label>
          <label>
            <input
              type="radio"
              name="specialization"
              required
              value="linguistic"
            />Лингвистический
          </label>
          <label>
            <input
              type="radio"
              name="specialization"
              required
              value="natural"
            />Естественнонаучный
          </label>
          <label>
            <input
              type="radio"
              name="specialization"
              required
              value="mathematical"
              checked
            />Физико-математический
          </label>
          <label>
            <input
              type="radio"
              name="specialization"
              required
              value="noSpecialization"
            />Без профиля
          </label>
        </fieldset>
        <h4>Результаты тестов:</h4>
        <label for="conceptualIntuitiveIntellect"
          >Понятийное интуитивное мышление</label
        >
        <input
          type="number"
          id="conceptualIntuitiveIntellect"
          name="conceptualIntuitiveIntellect"
          min="0"
          max="20"
          value="1"
          required
        />
        <label for="conceptualLogicalIntellect"
          >Понятийное логическое мышление</label
        >
        <input
          type="number"
          id="conceptualLogicalIntellect"
          name="conceptualLogicalIntellect"
          min="0"
          max="20"
          value="2"
          required
        />
        <label for="conceptualCategorization">Понятийная категоризация</label>
        <input
          type="number"
          id="conceptualCategorization"
          name="conceptualCategorization"
          min="0"
          max="20"
          value="3"
          required
        />
        <label for="abstractIntellect">Абстрактное мышление</label>
        <input
          type="number"
          id="abstractIntellect"
          name="abstractIntellect"
          min="0"
          max="10"
          value="4"
          required
        />
        <label for="mathematicalIntuition">Математическая интуиция</label>
        <input
          type="number"
          id="mathematicalIntuition"
          name="mathematicalIntuition"
          min="0"
          max="20"
          value="5"
          required
        />
        <h5>Визуальный интеллект</h5>
        <label for="structuralVisualIntellect">Структурный</label>
        <input
          type="number"
          id="structuralVisualIntellect"
          name="structuralVisualIntellect"
          min="0"
          max="12"
          value="6"
          required
        />
        <label for="dynamicVisualIntellect">Динамический</label>
        <input
          type="number"
          id="dynamicVisualIntellect"
          name="dynamicVisualIntellect"
          min="0"
          max="12"
          value="7"
          required
        />
        <label for="combinatorialVisualIntellect">Комбинаторный</label>
        <input
          type="number"
          id="combinatorialVisualIntellect"
          name="combinatorialVisualIntellect"
          min="0"
          max="12"
          value="8"
          required
        />
        <label for="abstractVisualIntellect">Абстрактный</label>
        <input
          type="number"
          id="abstractVisualIntellect"
          name="abstractVisualIntellect"
          min="0"
          max="12"
          value="9"
          required
        />
        <label for="figurativeSynthesis">Образный синтез</label>
        <input
          type="number"
          id="figurativeSynthesis"
          name="figurativeSynthesis"
          min="0"
          max="20"
          value="10"
          required
        />
        <label for="spatialAnalysis">Пространственный анализ</label>
        <input
          type="number"
          id="spatialAnalysis"
          name="spatialAnalysis"
          min="0"
          max="20"
          value="11"
          required
        />
        <label for="divergentIntellect">Дивергентное мышление</label>
        <input
          type="number"
          id="divergentIntellect"
          name="divergentIntellect"
          min="0"
          max="10"
          value="9"
          required
        />
        <label for="imagination">Воображение</label>
        <input
          type="number"
          id="imagination"
          name="imagination"
          min="0"
          max="20"
          value="13"
          required
        />
        <label for="awareness">Осведомленность, эрудиция</label>
        <input
          type="number"
          id="awareness"
          name="awareness"
          min="0"
          max="20"
          value="14"
          required
        />
        <label for="russianReadingSkill">Навык чтения (русский язык)</label>
        <input
          type="number"
          id="russianReadingSkill"
          name="russianReadingSkill"
          min="0"
          max="10"
          value="8"
          required
        />
        <label for="englishReadingSkill">Навык чтения (английский язык)</label>
        <input
          type="number"
          id="englishReadingSkill"
          name="englishReadingSkill"
          min="0"
          max="10"
          value="8"
          required
        />
        <label for="logicalMemory">Оперативная логическая память</label>
        <input
          type="number"
          id="logicalMemory"
          name="logicalMemory"
          min="0"
          max="20"
          value="17"
          required
        />
        <label for="informationProcessingSpeed"
          >Скорость переработки информации</label
        >
        <input
          type="number"
          id="informationProcessingSpeed"
          name="informationProcessingSpeed"
          min="0"
          max="100"
          value="18"
          required
        />
        <label for="attentiveness">Внимательность</label>
        <input
          type="number"
          step="any"
          id="attentiveness"
          name="attentiveness"
          min="0.8"
          max="1"
          value="0.9"
          required
        />
        <button type="submit">Обработать результаты</button>
      </form>
    </div>
    <div class="mainAds block">Реклама</div>
    <div class="footer block">Футер</div>

    <script src="scripts/burgerMenu.js"></script>
    <script src="scripts/testProcessing.js" type="module"></script>
  </body>
</html>
